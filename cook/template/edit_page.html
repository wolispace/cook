<form action="" method="post">
  <input type="hidden" id="action" name="action" value="save" />
  <input type="hidden" id="type" name="type" value="page" />
  <input type="hidden" id="oldpage" name="oldpage" value="{{page}}" />
  <label for="name">Name</label>
  <input type="text" name="name" id="name" value="{{name}}" placeholder="The name of your page" autocomplete="off"/>
  <label for="page">Handle or acronym</label>
  <input type="text" name="page" id="page" value="{{page}}" placeholder="A word used in the url eg: 'rbw' used as /?rbw" />  
  <label for="tagline">Tagline</label>
  <input type="text" name="tagline" id="tagline" placeholder="A short and pithy description of your page" value="{{tagline}}" />  
  <label for="code">Code</label>
  <input type="text" name="code" id="code" placeholder="Share this with others who can edit your page" value="{{code}}" />
  <label for="tags">Tags</label>
  <textarea id="tags" name="tags" placeholder="Tags, one per line eg: Savory, Sweet, Breakfast">{{members}}</textarea>

</form>
<div class="dialogbuttons">
  {{buttons}}
</div>
