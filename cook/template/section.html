<section class="section">
  <div class="row">
    <div class="imagebox">
      <img src="image" />
    </div>
    <div class="thingbox">
      <div>
        <a href="{{url}}">
          <span class="title">{{title}}</span>        
        </a>
      </div>
      <div>
        {{description}}
      </div>
    </div>
  </div>
  <div class="tags">{{tags}}</div>
  <div class="edit" onclick="editSection('{{sectionId}}')"><i class="fas fa-pencil"></i></div>
</section>
