<form action="" method="post">
  <input type="hidden" id="action" name="action" value="save" />
  <input type="hidden" id="type" name="type" value="section" />
  <input type="hidden" id="section" name="section" value="{{section}}" />
  <label for="url">Url</label>
  <input type="text" name="url" id="url" value="{{url}}" />
  <label for="title">Title</label>
  <input type="text" name="title" id="title" value="{{title}}" />
  <label for="image">Image</label>
  <input type="text" name="image" id="image" value="{{image}}" />  
  <div class="edittags">{{edittags}}</div>
  <input type="text" name="newtags" id="newtags" 
  placeholder="Type new tags seperated by spaces" />
</form>
<div class="dialogbuttons">
  {{buttons}}
</div>
